<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soliloquy — Class Browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <header id="top-bar">
      <div class="brand">&#9876; Soliloquy <span class="brand-sub">Class Browser</span></div>
      <nav class="top-bar-nav">
        <a class="top-bar-link active" href="#">Class Browser</a>
        <a class="top-bar-link" href="../character-builder/">Character Builder</a>
        <a class="top-bar-link" href="../npc-browser/">NPC Browser</a>
      </nav>
      <input id="search" type="search"
             placeholder="Search &mdash; try &quot;guard&quot; or &quot;tag:aura&quot;&hellip;"
             title="Space-separated terms are ANDed. Use tag:spell or #spell to match a tag."
             autocomplete="off">
    </header>


    <div id="layout">

      <nav id="sidebar">
        <div class="sidebar-label">Categories</div>
        <button class="cat-btn active" data-cat="all">All Classes</button>
        <!-- Additional category buttons injected by browser.js -->
      </nav>

      <main id="main-content">
        <!-- Active query, one removable chip per term (populated by browser.js) -->
        <div id="query-chips" hidden></div>

        <div id="class-grid">
          <p class="loading-msg">Loading&hellip;</p>
        </div>
      </main>

    </div>
  </div>

  <!-- marked for Markdown → HTML (loaded before browser.js) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="browser.js"></script>
</body>
</html>
